---
k3s_install_script_url: https://get.k3s.io
k3s_install_script_path: /usr/local/bin/k3s-install.sh

k3s_etcd_snapshot_cron: "0 */6 * * *"
k3s_etcd_snapshot_retention: 20

k3s_node_taint: "node-role.kubernetes.io/control-plane=true:NoSchedule"

# Kubeconfig na maszynie kontrolnej
k3s_kubeconfig_name: k3s-pve2
k3s_kubeconfig_path: "{{ lookup('env', 'HOME') }}/.kube/{{ k3s_kubeconfig_name }}.yaml"
k3s_kubeconfig_main: "{{ lookup('env', 'HOME') }}/.kube/config"
k3s_kubeconfig_merge: true
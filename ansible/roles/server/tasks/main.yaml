---
- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_bin_before

- name: k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"
  become: true

- name: k3s configuration file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  notify: Restart k3s
  become: true

- name: Download installation script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    mode: "0755"
  become: true

- name: Install k3s (server) in the specified version
  ansible.builtin.command: "{{ k3s_install_script_path }}"
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: server

- name: Enable and start the k3s service
  ansible.builtin.systemd:
    name: k3s
    enabled: true
    state: started

- name: Wait for API
  ansible.builtin.wait_for:
    host: "{{ ansible_host }}"
    port: 6443
    timeout: 180

- name: Wait for node to be Ready
  ansible.builtin.command: >
    k3s kubectl get node {{ ansible_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_node_ready
  until: k3s_node_ready.stdout == "True"
  retries: 36
  delay: 5
  changed_when: false

- name: k3s kubeconfig directory
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_path | dirname }}"
    state: directory
    mode: "0700"
  delegate_to: localhost
  become: false

- name: Download kubeconfig to a separate file
  ansible.builtin.fetch:
    src: /etc/rancher/k3s/k3s.yaml
    dest: "{{ k3s_kubeconfig_path }}"
    flat: true

- name: Fix kubeconfig to use the correct IP address and context name
  ansible.builtin.replace:
    path: "{{ k3s_kubeconfig_path }}"
    regexp: "{{ item.re }}"
    replace: "{{ item.to }}"
  loop:
    - { re: 'https://127\.0\.0\.1:6443', to: "https://{{ ansible_host }}:6443" }
    - { re: '^([ ]*(?:- )?(?:name|cluster|user|current-context)): default$', to: '\1: {{ k3s_kubeconfig_name }}' }
  delegate_to: localhost
  become: false

- name: Limit kubeconfig permissions to the owner only
  ansible.builtin.file:
    path: "{{ k3s_kubeconfig_path }}"
    mode: "0600"
  delegate_to: localhost
  become: false

- name: Merge kubeconfig with existing kubeconfig if requested
  ansible.builtin.shell: |
    set -e
    main="{{ k3s_kubeconfig_main }}"
    new="{{ k3s_kubeconfig_path }}"
    tmp=$(mktemp)
    if [ -f "$main" ]; then
      cp -p "$main" "$main.bak"
      KUBECONFIG="$new:$main" kubectl config view --flatten > "$tmp"
    else
      KUBECONFIG="$new" kubectl config view --flatten > "$tmp"
    fi
    install -m 600 "$tmp" "$main"
    rm -f "$tmp"
  args:
    executable: /bin/bash
  changed_when: true
  when: k3s_kubeconfig_merge | bool
  delegate_to: localhost
  become: false
---
- name: Verify required variables are set
  ansible.builtin.assert:
    that:
      - k3s_version is defined
      - k3s_version is match('^v\d+\.\d+\.\d+\+k3s\d+$')
      - k3s_token is defined
      - k3s_token | length > 0
      - groups['server'] is defined
      - groups['server'] | length > 0
    fail_msg: "Ustaw k3s_version, k3s_token i upewnij się, że grupa 'server' nie jest pusta."
    quiet: true

- name: Check if k3s is already installed
  ansible.builtin.stat:
    path: /usr/local/bin/k3s
  register: k3s_agent_bin_before

- name: Wait for the server API to be reachable from this node
  ansible.builtin.wait_for:
    host: "{{ k3s_server_host }}"
    port: 6443
    timeout: 180

- name: k3s configuration directory
  ansible.builtin.file:
    path: /etc/rancher/k3s
    state: directory
    mode: "0755"

- name: k3s configuration file
  ansible.builtin.template:
    src: config.yaml.j2
    dest: /etc/rancher/k3s/config.yaml
    mode: "0600"
  no_log: true
  notify: Restart k3s-agent

- name: Download installation script
  ansible.builtin.get_url:
    url: "{{ k3s_install_script_url }}"
    dest: "{{ k3s_install_script_path }}"
    mode: "0755"

- name: Install k3s (agent) in the specified version
  ansible.builtin.command: "{{ k3s_install_script_path }}"
  args:
    creates: /usr/local/bin/k3s
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_EXEC: agent

- name: Enable and start the k3s-agent service
  ansible.builtin.systemd:
    name: k3s-agent
    enabled: true
    state: started

- name: Wait for the node to join the cluster and be Ready
  ansible.builtin.command: >
    k3s kubectl get node {{ ansible_hostname }}
    -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}'
  register: k3s_agent_node_ready
  until: k3s_agent_node_ready.stdout == "True"
  retries: 36
  delay: 5
  changed_when: false
  delegate_to: "{{ groups['server'][0] }}"

- name: Install packages required for Longhorn
  ansible.builtin.apt:
    name: [nfs-common, open-iscsi, cryptsetup, dmsetup]
    state: present
  become: true

- name: Enable and start required services for Longhorn
  ansible.builtin.systemd:
    name: "{{ item }}"
    enabled: true
    state: started
  loop: [iscsid]
  become: true
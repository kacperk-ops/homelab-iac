apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: monitoring
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://prometheus-community.github.io/helm-charts
    chart: kube-prometheus-stack
    targetRevision: 92.3.0
    helm:
      releaseName: monitoring
      valuesObject:
        grafana:
          admin:
            existingSecret: grafana-admin
        defaultRules:
          rules:
            windows: false
            kubeProxy: false
            kubeControllerManager: false
            kubeScheduler: false
        prometheus:
          route:
            main:
              enabled: true
              hostnames:
                - prometheus.lab.home
              parentRefs:
                - name: traefik-gw
                  namespace: kube-system
                  sectionName: websecure
          prometheusSpec:
            retention: 30d
            resources:
              requests:
                memory: 512Mi
                cpu: 250m
              limits:
                memory: 3Gi
                cpu: 1000m
            storageSpec:
              volumeClaimTemplate:
                spec:
                  resources:
                    requests:
                      storage: 20Gi
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true

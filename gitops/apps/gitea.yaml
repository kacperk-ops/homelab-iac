apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: gitea
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  project: infrastructure
  source:
    repoURL: https://dl.gitea.com/charts/
    chart: gitea
    targetRevision: 12.7.0
    helm:
      releaseName: gitea
      valuesObject:
        gitea:
          admin:
            existingSecret: gitea-admin
            passwordMode: initialOnlyNoReset
          metics:
            enabled: true
            serviceMonitor:
              additionalLabes:
                release: monitoring
              enabled: true
        postgresql:
          enabled: true
          primary:
            resources:
              limits:
                cpu: 1000m
                memory: 2Gi
              requests:
                cpu: 100m
                memory: 512Mi
        postgresql-ha:
          enabled: false
        valkey:
          enabled: true
        valkey-cluster:
          enabled: false
  destination:
    server: https://kubernetes.default.svc
    namespace: gitea
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

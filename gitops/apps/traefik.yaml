apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: traefik
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://traefik.github.io/charts
    chart: traefik
    targetRevision: 41.7.1
    helm:
      releaseName: traefik
      valuesObject:
        providers:
          kubernetesIngress:
            enabled: false
          kubernetesGateway:
            enabled: true
        gateway:
          enabled: true
          annotations:
            cert-manager.io/cluster-issuer: mkcert-ca
          name: traefik-gw
          listeners:
            web:
              namespacePolicy:
                from: All
            websecure:
              port: 8443
              protocol: HTTPS
              namespacePolicy:
                from: All
              hostname: "*.lab.home"
              mode: Terminate
              certificateRefs:
                - name: wildcard-lab-home-cert
                  kind: Secret
                  group: ''
  destination:
    server: https://kubernetes.default.svc
    namespace: kube-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true
    syncOptions:
      - ServerSideApply=true

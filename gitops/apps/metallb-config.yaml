apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: metallb-config
  namespace: argocd
spec:
  project: infrastructure
  source:
    repoURL: https://github.com/kacperk-ops/homelab-iac.git
    targetRevision: HEAD
    path: gitops/config/metallb
    destination:
      - server: https://kubernetes.default.svc
        namespace: metallb-system
  syncPolicy:
    automated:
      prune: false
      selfHeal: true

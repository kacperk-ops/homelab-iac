apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: grafana-http-route
  namespace: monitoring
spec:
  parentRefs:
    - name: traefik-gw
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - grafana.lab.home
  rules:
    - backendRefs:
        - name: grafana
          port: 3000
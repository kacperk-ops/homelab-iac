apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: gitea-http-route
  namespace: gitea
spec:
  parentRefs:
    - name: traefik-gw
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - gitea.lab.home
  rules:
    - backendRefs:
        - name: gitea-http
          port: 3000
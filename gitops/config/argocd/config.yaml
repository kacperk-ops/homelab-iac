apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: argocd-http-route
  namespace: argocd
spec:
  parentRefs:
    - name: traefik-gw
      namespace: kube-system
      sectionName: websecure
  hostnames:
    - argocd.lab.home
  rules:
    - backendRefs:
        - name: argocd-server
          port: 80